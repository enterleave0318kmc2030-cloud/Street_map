<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ヘビ＆日陰マップ</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    html, body {
      margin: 0;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView(
    [33.9720, 134.3611],
    15
);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);

fetch("./data/Snake&sun_2.geojson")
.then(response => response.json())
.then(data => {

    const layer = L.geoJSON(data, {

        onEachFeature: function(feature, layer) {
            const p = feature.properties;

            layer.bindPopup(`
                <b>${p.place ?? "場所不明"}</b><br><br>

                ID：${p.id ?? "不明"}<br>
                日付：${p.date ?? "不明"}<br>
                時間：${p.time ?? "不明"}<br>
                状況：${p.situation ?? "不明"}<br>
                ヘビの種類：${p.snake_type ?? "不明"}<br>
                頭数：${p.count ?? "不明"}<br>
                体長：${p.length ?? "不明"}
            `);
        }

    }).addTo(map);

    if (layer.getBounds().isValid()) {
        map.fitBounds(layer.getBounds());
    }

})
.catch(error => {
    console.error(error);
    alert("GeoJSONを読み込めませんでした。ファイル名や保存場所を確認してください。");
});
</script>

</body>
</html>
